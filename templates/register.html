{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block body %}
<div class="topbar">
    <a class="brand" href="/">Lab<span>2</span></a>
</div>

<main class="page page--center">
    <section class="card">
        <h1>Регистрация</h1>
        <p class="lead">Придумайте логин и пароль для нового аккаунта.</p>

        <form method="POST">
            <div>
                <label for="username">Логин</label>
                <input id="username" type="text" name="username"
                       placeholder="Придумай логин" autocomplete="username" required>
            </div>

            <div>
                <label for="password">Пароль</label>
                <input id="password" type="password" name="password"
                       placeholder="Придумай пароль" autocomplete="new-password" required>
            </div>

            <button class="btn btn--block" type="submit">Зарегистрироваться</button>
        </form>

        <p class="switch">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
    </section>
</main>
{% endblock %}
